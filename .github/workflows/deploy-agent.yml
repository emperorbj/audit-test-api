# Deploys the agent to AWS Lambda: ONE image, used by TWO functions
# (audit-agent = the agent API, audit-mcp = the MCP server with the tools).
# Runs automatically when something in ai-agent/ changes on the main branch,
# or by hand from the GitHub "Actions" tab (the "Run workflow" button).

name: Deploy agent

on:
  push:
    branches: [main]
    paths:
      - "ai-agent/**"
      - ".github/workflows/deploy-agent.yml"
  workflow_dispatch: # adds the "Run workflow" button

permissions:
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}   # the same variable the backend workflow uses
  ECR_REPOSITORY: audit-agent

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Log in to AWS (with the github-deploy user's access key)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}         # GitHub secret
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }} # GitHub secret
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        working-directory: ai-agent
        run: |
          IMAGE=${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY
          # Two tags: the commit ID (to know exactly what's deployed) and "latest"
          docker build --platform linux/amd64 --provenance=false \
            -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest
          echo "IMAGE_URI=$IMAGE:${{ github.sha }}" >> $GITHUB_ENV

      - name: Point both Lambda functions at the new image
        run: |
          for FUNCTION in audit-mcp audit-agent; do
            # The very first run happens before the functions exist. Then we only push the image.
            if aws lambda get-function --function-name $FUNCTION > /dev/null 2>&1; then
              aws lambda update-function-code --function-name $FUNCTION --image-uri $IMAGE_URI
              aws lambda wait function-updated --function-name $FUNCTION
              echo "Deployed $IMAGE_URI to $FUNCTION"
            else
              echo "Lambda function '$FUNCTION' doesn't exist yet. Image pushed; create it in the console."
            fi
          done
