[project]
name = "backend"
version = "0.1.0"
description = "Backend API + MCP tools for the AI audit investigation agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi[standard]>=0.163.1",
    "psycopg[binary]>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "sqlalchemy[asyncio]>=2.1.8",
]

# Tells the `fastapi` command where our app lives (folder app/, file main.py, variable app)
[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "faker>=40.54.0",
]
