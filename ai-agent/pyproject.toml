[project]
name = "ai-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.38",
    "fastapi[standard]>=0.165.0",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.10",
    "langchain-mcp-adapters>=0.3.2",
    "pydantic-settings>=2.16.3",
]

# Tells the `fastapi` command where our app lives (folder app/, file main.py, variable app)
[tool.fastapi]
entrypoint = "app.main:app"
